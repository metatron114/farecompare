[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farecompare"
version = "1.0.0"
description = "车票 / 机票 比价搜索：本地运行，聚合火车票与机票并按最低价排序，支持多线路中转与航铁联程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "farecompare contributors" }]
keywords = ["train", "flight", "china", "12306", "price-comparison", "travel", "ticket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Office/Business",
]

# 说明：本项目只使用 Python 标准库，运行时无任何第三方依赖。
dependencies = []

[project.optional-dependencies]
# 可选的开发者依赖（打包与检查用，运行程序本身不需要）
dev = ["build", "ruff"]

[project.scripts]
farecompare = "farecompare.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/farecompare"
Repository = "https://github.com/yourname/farecompare"
"Bug Tracker" = "https://github.com/yourname/farecompare/issues"

[tool.setuptools]
packages = ["farecompare"]
include-package-data = true

[tool.setuptools.package-data]
farecompare = ["web/*.html", "web/static/*.css", "web/static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["cache", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
